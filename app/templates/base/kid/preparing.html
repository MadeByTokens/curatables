{% extends "kid/base.html" %}
{% block head_extra %}
<meta http-equiv="refresh" content="10">
{% endblock %}
{% block content %}
<div class="preparing" role="status">
  <img class="preparing-thumb" src="/media/thumb/{{ video.video_id }}" alt="">
  <div class="preparing-icon" aria-hidden="true">&#8987;</div>
  <h2>Getting your video ready&hellip;</h2>
  <p class="preparing-title">{{ video.title }}</p>
  <p class="preparing-hint">It will start by itself. You can wait here.</p>
  <a class="big-home-btn" href="/"><span aria-hidden="true">&#127968;</span> Home</a>
</div>
{% endblock %}
