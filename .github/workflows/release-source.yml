name: Release update file

# Attaches the file the Pi image's "Update Curatables" button downloads:
# curatables-<version>.tar.gz (the tagged source) and SHA256SUMS. The
# box checks the download against SHA256SUMS before using it.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)attach the files to, e.g. v0.6.0"
        required: true

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Check the tag matches the code's version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version="${TAG#v}"
          app="$(python3 -c 'import re; print(re.search(r"__version__ = \"([^\"]+)\"", open("app/__init__.py").read()).group(1))')"
          proj="$(python3 -c 'import re; print(re.search(r"^version = \"([^\"]+)\"", open("pyproject.toml").read(), re.M).group(1))')"
          if [ "$version" != "$app" ] || [ "$version" != "$proj" ]; then
            echo "Tag $TAG does not match app/__init__.py ($app) and pyproject.toml ($proj)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the tarball and checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git archive --format=tar.gz --prefix="curatables-${VERSION}/" \
            -o "curatables-${VERSION}.tar.gz" HEAD
          sha256sum "curatables-${VERSION}.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release upload "$TAG" "curatables-${VERSION}.tar.gz" SHA256SUMS --clobber
